<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f6fb">
  <title>Quick Quiz</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1c2541;
      background: #f4f6fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .quiz-card {
      width: min(100%, 560px);
      padding: clamp(24px, 6vw, 40px);
      border: 1px solid #e4e8f1;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 18px 50px rgb(28 37 65 / 9%);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #5267d8;
      font-size: 0.8rem;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 2.7rem);
      letter-spacing: -0.05em;
    }

    .streak {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 24px 0;
      padding: 10px 14px;
      border-radius: 999px;
      background: #fff4df;
      color: #8a5200;
      font-weight: 700;
    }

    .streak strong {
      font-size: 1.15rem;
    }

    .question {
      min-height: 3.5em;
      margin: 0 0 20px;
      font-size: clamp(1.25rem, 4vw, 1.55rem);
      font-weight: 700;
      line-height: 1.4;
    }

    .answers {
      display: grid;
      gap: 12px;
    }

    button {
      width: 100%;
      min-height: 52px;
      border: 1px solid #dce2ef;
      border-radius: 12px;
      padding: 12px 16px;
      background: #fff;
      color: inherit;
      font: inherit;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: border-color 140ms ease, background-color 140ms ease, transform 140ms ease;
    }

    .answers button:hover:not(:disabled),
    .answers button:focus-visible {
      border-color: #5267d8;
      background: #f5f6ff;
      outline: none;
      transform: translateY(-1px);
    }

    button:focus-visible {
      outline: 3px solid rgb(82 103 216 / 35%);
      outline-offset: 3px;
    }

    .answers button:disabled {
      cursor: default;
    }

    .answers button.correct {
      border-color: #25865a;
      background: #eaf7f0;
    }

    .answers button.incorrect {
      border-color: #cb4141;
      background: #fff0f0;
    }

    .feedback {
      min-height: 1.5em;
      margin: 16px 0 0;
      color: #59637a;
      font-weight: 600;
    }

    .feedback[data-state="wrong"] {
      color: #b42d2d;
    }

    .play-again {
      margin-top: 20px;
      border: 0;
      background: #5267d8;
      color: #fff;
      text-align: center;
    }

    .play-again:hover {
      background: #4054c3;
    }

    [hidden] {
      display: none !important;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="quiz-card">
    <p class="eyebrow">Quick quiz</p>
    <h1>Keep your streak</h1>

    <p class="streak" aria-live="polite">
      Current streak: <strong id="streak">0</strong>
    </p>

    <section aria-labelledby="question" aria-live="polite">
      <h2 class="question" id="question"></h2>
      <div class="answers" id="answers"></div>
      <p class="feedback" id="feedback" role="status"></p>
      <button class="play-again" id="play-again" type="button" hidden>Play Again</button>
    </section>
  </main>

  <script>
    const questions = [
      {
        question: "Which planet is known as the Red Planet?",
        answers: ["Mars", "Venus", "Jupiter", "Mercury"],
        correct: "Mars"
      },
      {
        question: "What is the largest ocean on Earth?",
        answers: ["Atlantic Ocean", "Indian Ocean", "Pacific Ocean", "Arctic Ocean"],
        correct: "Pacific Ocean"
      },
      {
        question: "How many sides does a hexagon have?",
        answers: ["Five", "Six", "Seven", "Eight"],
        correct: "Six"
      },
      {
        question: "Which animal is the tallest in the world?",
        answers: ["Elephant", "Ostrich", "Giraffe", "Camel"],
        correct: "Giraffe"
      },
      {
        question: "What is the chemical symbol for gold?",
        answers: ["Ag", "Au", "Go", "Gd"],
        correct: "Au"
      },
      {
        question: "Which instrument has keys, pedals, and strings?",
        answers: ["Piano", "Flute", "Drum", "Trumpet"],
        correct: "Piano"
      },
      {
        question: "What is the capital of Japan?",
        answers: ["Seoul", "Beijing", "Bangkok", "Tokyo"],
        correct: "Tokyo"
      },
      {
        question: "How many minutes are there in one hour?",
        answers: ["30", "45", "60", "90"],
        correct: "60"
      }
    ];

    const questionElement = document.querySelector("#question");
    const answersElement = document.querySelector("#answers");
    const streakElement = document.querySelector("#streak");
    const feedbackElement = document.querySelector("#feedback");
    const playAgainButton = document.querySelector("#play-again");
    let streak = 0;
    let previousQuestionIndex = -1;

    function chooseQuestion() {
      let index;
      do {
        index = Math.floor(Math.random() * questions.length);
      } while (questions.length > 1 && index === previousQuestionIndex);
      previousQuestionIndex = index;
      return questions[index];
    }

    function showQuestion() {
      const current = chooseQuestion();
      questionElement.textContent = current.question;
      answersElement.replaceChildren();
      feedbackElement.textContent = "";
      feedbackElement.dataset.state = "";
      playAgainButton.hidden = true;

      const shuffledAnswers = [...current.answers].sort(() => Math.random() - 0.5);
      for (const answer of shuffledAnswers) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = answer;
        button.addEventListener("click", () => selectAnswer(button, answer, current.correct));
        answersElement.append(button);
      }
    }

    function selectAnswer(selectedButton, answer, correctAnswer) {
      const answerButtons = answersElement.querySelectorAll("button");
      answerButtons.forEach((button) => {
        button.disabled = true;
        if (button.textContent === correctAnswer) {
          button.classList.add("correct");
        }
      });

      if (answer === correctAnswer) {
        streak += 1;
        streakElement.textContent = String(streak);
        feedbackElement.textContent = "Correct! Here comes the next question.";
        window.setTimeout(showQuestion, 700);
        return;
      }

      selectedButton.classList.add("incorrect");
      feedbackElement.dataset.state = "wrong";
      feedbackElement.textContent = `Game over! Your streak was ${streak}.`;
      playAgainButton.hidden = false;
    }

    playAgainButton.addEventListener("click", () => {
      streak = 0;
      streakElement.textContent = "0";
      showQuestion();
    });

    showQuestion();
  </script>
</body>
</html>
